<nav class="navbar navbar-expand-lg ninja-navbar">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            <span class="brand-icon">📚</span>
            <span class="brand-name">BOOK NINJA</span>
        </a>
        
        <div class="d-flex align-items-center order-lg-3">
            <a href="{{ url_for('cart') }}" class="nav-link cart-link position-relative me-3">
                <i class="bi bi-cart"></i>
                {% if cart_count > 0 %}
                    <span class="cart-badge">{{ cart_count }}</span>
                {% endif %}
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                {% if current_user.is_authenticated %}
                    <li class="nav-item">
                        <span class="nav-link user-greeting">Hi, {{ current_user.name }}</span>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('orders') }}">Orders</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('wishlist') }}">
                            <i class="bi bi-heart"></i> Wishlist
                        </a>
                    </li>
                    {% if current_user.is_admin %}
                        <li class="nav-item">
                            <a class="nav-link admin-link" href="{{ url_for('admin_dashboard') }}">
                                <i class="bi bi-shield-lock"></i> Admin
                            </a>
                        </li>
                    {% endif %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('register') }}">Sign Up</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('login') }}">Log In</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
