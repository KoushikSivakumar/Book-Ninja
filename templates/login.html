{% extends 'base.html' %}

{% block title %}Log In - Book Ninja{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Log in to your Book Ninja account.</p>
                
                <form action="{{ url_for('login') }}" method="post" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="Enter your email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" name="password" id="password" placeholder="Enter your password" required>
                    </div>
                    
                    <div class="form-group remember-me">
                        <label>
                            <input type="checkbox" name="remember" value="yes">
                            Remember me
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-auth">Log In</button>
                </form>
                
                <p class="auth-switch">
                    Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a>
                </p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
